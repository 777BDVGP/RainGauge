; PlatformIO Project Configuration File — Rain Gauge (tipping bucket, IR beam)
;
; Board: WEMOS LOLIN S2 Mini (ESP32-S2, single core, 4 MB Flash, 2 MB PSRAM)
; Partition scheme: Custom OTA (2 x 1.5 MB App / 960 KB SPIFFS)
;
; You do not need PlatformIO to USE the gauge: install it from the browser
; (https://777bdvgp.github.io/RainGauge/) and update it from its ABOUT page.
;
; To build it yourself:
;   pio run -e usb -t upload        first flash over USB (hold 0, tap RST,
;                                   release 0 if the S2 Mini is not found)
;   pio run -e ota -t upload --upload-port <gauge ip>     later over WiFi
;   (your own upload targets: private.ini, see private.example.ini)
; Every build also writes firmware_out/RainGauge_v<ver>.bin (ABOUT page
; upload) and RainGauge_v<ver>_full.bin (browser flash of a new board).
;
; WiFi: none built in.  A new gauge opens the hotspot "RainGauge-Setup";
; connect a phone to it and choose your network.  (Optional built-in
; networks: src/wifi_secrets.example.h.)
;
; Platform pinned by exact URL (pioarduino 53.03.13 = arduino-esp32 3.1.3 /
; IDF 5.3).  Do not change it to a bare "espressif32".

[platformio]
default_envs = usb
extra_configs = private.ini     ; your own upload targets (not committed, see private.example.ini)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = lolin_s2_mini
framework = arduino
board_build.partitions = partitions_ota.csv
board_build.filesystem = spiffs
monitor_speed = 115200
extra_scripts =
    post:tools/export_bin.py   ; firmware_out/: RainGauge_v<ver>.bin (update) + _full.bin (new board)
build_flags =
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    mathieucarbou/AsyncTCP @ ^3.2.14
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; ── USB upload (direct cable) ─────────────────────────────────────────────────
[env:usb]
upload_protocol = esptool
upload_speed = 921600

; ── OTA upload (over WiFi) ────────────────────────────────────────────────────
[ota]
upload_protocol = espota
upload_flags =
    --port=3232
    --timeout=30

[env:ota]
extends = ota            ; pio run -e ota -t upload --upload-port <gauge ip>
